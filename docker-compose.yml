# Local Postgres for development. One command up, one command down, and the
# data survives a restart in a named volume.
#
#   docker compose up -d      start
#   docker compose down       stop, keep the data
#   docker compose down -v    stop and wipe the data
#
# Production is Neon (decision D6), which speaks the same wire protocol, so the
# only thing that changes between here and there is DATABASE_URL.

services:
  db:
    image: postgres:17-alpine
    container_name: jobs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
      # Deterministic collation, so ORDER BY on company names does not depend on
      # whichever locale the host happens to have.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - jobs-db-data:/var/lib/postgresql/data
    healthcheck:
      # Nothing should connect before the server is actually accepting queries;
      # a migration racing initdb fails in ways that look like a schema bug.
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  jobs-db-data:

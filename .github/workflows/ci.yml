name: CI — build and typecheck

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # A placeholder origin on purpose. This job asks "does it compile"; the
        # real origin is enforced in deploy.yml, which passes vars.SITE_URL and
        # fails the build if it is unset.
        env:
          SITE: https://ci.invalid
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Verify schema JSON is valid
        run: node -e "for (const f of ['packages/schema/src/fact-record.schema.json','packages/schema/src/draft-post.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('schemas ok')"

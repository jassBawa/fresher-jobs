name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Skip cleanly until Cloudflare is actually set up, rather than failing on
    # every push. A red X that means "not configured yet" is indistinguishable
    # from one that means "the deploy broke", and the second is the one worth
    # noticing. Set both repository variables and this starts running.
    if: ${{ vars.CF_PAGES_PROJECT != '' && vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build schema
        run: pnpm --filter @jobs/schema run build

      - name: Build site
        env:
          SITE: ${{ vars.SITE_URL }}
        run: pnpm --filter @jobs/web run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ vars.CF_PAGES_PROJECT }}
          workingDirectory: .
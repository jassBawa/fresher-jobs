name: Ingest jobs and draft posts

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Free-tier providers only, in detection order. Ollama is not an option
      # here — there is no model server on a runner, and pulling one per run
      # would cost more minutes than the extraction itself.
      - name: Extract facts from new postings
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_POSTS_PER_RUN: "25"
        run: pnpm --filter @jobs/ingest run fetch

      # If every provider is rate-limited this still writes complete drafts,
      # tagged generatedBy: template. It does not fail the run.
      - name: Write drafts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm --filter @jobs/ingest run draft

      - name: Commit new drafts
        run: |
          git config user.name "ingest-bot"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add apps/ingest/data/
          if git diff --staged --quiet; then
            echo "No new drafts."
          else
            git commit -m "ingest: $(date -u +%Y-%m-%d) drafts"
            git push
          fi
